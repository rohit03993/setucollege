<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b45f5">
  <title>Colleges — Admission Setu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="browse">
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M5 22 V12 M27 22 V12" stroke="#5b45f5" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M5 22 H27" stroke="#1a1430" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M7 12 C12 5 20 5 25 12" stroke="#5b45f5" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      Admission Setu
    </a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/browse" aria-current="page">Colleges</a>
      <a href="/chances">Predict</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Colleges</p>
      <h1>Browse the catalogue.</h1>
      <form class="search" id="find" role="search">
        <label class="sr" for="q">Search colleges</label>
        <input id="q" type="search" placeholder="College, city, or state" autocomplete="off">
        <button class="button" type="submit">Search</button>
      </form>
    </section>
    <div class="filters">
      <div class="chips" id="chips" role="group" aria-label="Stream">
        <button class="chip" type="button" data-stream="" aria-pressed="true">All</button>
        <button class="chip" type="button" data-stream="Engineering">Engineering</button>
        <button class="chip" type="button" data-stream="Medical">Medical</button>
        <button class="chip" type="button" data-stream="Management">Management</button>
      </div>
      <label class="sr" for="sort">Sort</label>
      <select class="select" id="sort">
        <option value="name">Name</option>
        <option value="nirf">NIRF rank</option>
      </select>
    </div>
    <p class="status" id="status">Loading colleges…</p>
    <div class="list" id="list"></div>
    <div class="pager">
      <button class="ghost" id="prev" type="button">Previous</button>
      <p id="page-label"></p>
      <button class="ghost" id="next" type="button">Next</button>
    </div>
  </main>

  <nav class="tabbar" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/browse" aria-current="page">Colleges</a>
    <a href="/chances">Predict</a>
  </nav>
  <script src="/assets/app.js"></script>
</body>
</html>
