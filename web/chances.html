<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Predict — Admission Setu</title>
  <meta name="description" content="Check your JEE or NEET rank against last year's closing ranks on Admission Setu.">
  <link rel="icon" href="/assets/icon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icon.png?v=2">
  <meta property="og:site_name" content="Admission Setu">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Predict your college — Admission Setu">
  <meta property="og:description" content="Check your JEE or NEET rank against last year's closing ranks on Admission Setu.">
  <meta property="og:url" content="https://admissionsetu.co.in/chances">
  <meta property="og:image" content="https://admissionsetu.co.in/assets/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Admission Setu">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Predict your college — Admission Setu">
  <meta name="twitter:description" content="Check your JEE or NEET rank against last year's closing ranks on Admission Setu.">
  <meta name="twitter:image" content="https://admissionsetu.co.in/assets/share.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css?v=19">
</head>
<body data-page="chances">
  <header class="topbar">
    <div class="topbar-inner">
    <a class="brand" href="/">
      <img src="/assets/logo.jpg?v=2" alt="Admission Setu">
    </a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/browse">Colleges</a>
      <a href="/chances" aria-current="page">Predict</a>
    </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Predictor</p>
      <h1>Check last year's closing ranks.</h1>
      <p class="lede">A smaller rank is a better rank. Safer means your rank is clearly better than last year's closing rank.</p>
    </section>
    <form class="panel form" id="predict">
      <label class="field wide">
        <span>Exam</span>
        <select id="exam" name="exam">
          <option>JEE Main</option>
          <option>JEE Advanced</option>
          <option>NEET</option>
        </select>
      </label>
      <label class="field">
        <span>Rank</span>
        <input id="rank" name="rank" type="number" min="1" inputmode="numeric" required placeholder="15000">
      </label>
      <label class="field">
        <span>Category</span>
        <select id="category" name="category">
          <option value="OPEN">General</option>
          <option value="EWS">EWS</option>
          <option value="OBC-NCL">OBC-NCL</option>
          <option value="SC">SC</option>
          <option value="ST">ST</option>
        </select>
      </label>
      <fieldset class="field wide">
        <legend>Gender</legend>
        <div class="segment">
          <label><input type="radio" name="gender" value="male" checked> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </fieldset>
      <label class="field wide">
        <span>Home state</span>
        <select id="home_state" name="home_state"></select>
      </label>
      <label class="field wide" id="course-wrap">
        <span>Course</span>
        <select id="course" name="course">
          <option>MBBS</option>
          <option>BDS</option>
          <option>B.Sc Nursing</option>
        </select>
      </label>
      <button class="button" type="submit">Show chances</button>
    </form>
    <p class="status" id="status"></p>
    <div class="summary" id="summary"></div>
    <div class="list" id="results"></div>
    <button class="ghost full" id="more" type="button" hidden>Show more</button>
  </main>

  <nav class="tabbar" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/browse">Colleges</a>
    <a href="/chances" aria-current="page">Predict</a>
  </nav>
  <script src="/assets/app.js?v=15"></script>
</body>
</html>
